---
# Create Carbide VPC and prefix for cluster network isolation

- name: Set VPC and prefix names
  ansible.builtin.set_fact:
    carbide_vpc_name: "{{ carbide_infra_vpc_name_prefix }}-{{ carbide_infra_name }}"
    carbide_prefix_name: "prefix-{{ carbide_infra_name }}"
    carbide_use_existing_vpc: "{{ carbide_infra_vpc_id | default('') | length > 0 }}"
    carbide_use_existing_prefix: "{{ carbide_infra_vpc_prefix_id | default('') | length > 0 }}"

- name: Display VPC configuration
  ansible.builtin.debug:
    msg: >
      VPC mode: {{ 'using existing VPC ' + carbide_infra_vpc_id if carbide_use_existing_vpc else 'creating new VPC ' + carbide_vpc_name }}

# Use existing VPC if ID provided (template_parameters.vpc_id per D-05)
- name: Use existing VPC
  when: carbide_use_existing_vpc | bool
  ansible.builtin.set_fact:
    carbide_vpc_id: "{{ carbide_infra_vpc_id }}"
    carbide_vpc_created: false

# Create new VPC if not using existing (VPC-01)
- name: Create VPC for cluster network
  when: not (carbide_use_existing_vpc | bool)
  block:
    - name: Create VPC via Carbide API
      nvidia.bare_metal.vpc:
        state: present
        name: "{{ carbide_vpc_name }}"
        site_id: "{{ nvidia_bmm_site_id }}"
        network_virtualization_type: "{{ nvidia_bmm_network_virtualization_type }}"
        api_url: "{{ nvidia_bmm_api_url }}"
        api_token: "{{ nvidia_bmm_api_token }}"
        org: "{{ nvidia_bmm_org }}"
        api_path_prefix: "{{ nvidia_bmm_api_path_prefix | default('forge') }}"
      register: carbide_vpc_result

    - name: Store created VPC ID
      ansible.builtin.set_fact:
        carbide_vpc_id: "{{ carbide_vpc_result.resource.id }}"
        carbide_vpc_created: true

# Use existing prefix if ID provided
- name: Use existing VPC prefix
  when: carbide_use_existing_prefix | bool
  ansible.builtin.set_fact:
    carbide_vpc_prefix_id: "{{ carbide_infra_vpc_prefix_id }}"
    carbide_prefix_created: false

# Create new VPC prefix if not using existing (VPC-02)
- name: Create VPC prefix for IP allocation
  when: not (carbide_use_existing_prefix | bool)
  block:
    - name: Determine IP block for prefix allocation
      ansible.builtin.set_fact:
        carbide_effective_ip_block_id: "{{ carbide_infra_ip_block_id | default(nvidia_bmm_default_ip_block_id | default('')) }}"

    - name: Validate IP block ID is available
      ansible.builtin.assert:
        that:
          - carbide_effective_ip_block_id | length > 0
        fail_msg: "IP block ID required for VPC prefix creation. Set template_parameters.ip_block_id or NVIDIA_BMM_IP_BLOCK_ID env var"

    - name: Create VPC prefix via Carbide API
      nvidia.bare_metal.vpc_prefix:
        state: present
        name: "{{ carbide_prefix_name }}"
        vpc_id: "{{ carbide_vpc_id }}"
        ip_block_id: "{{ carbide_effective_ip_block_id }}"
        prefix_length: "{{ carbide_infra_prefix_length | int }}"
        api_url: "{{ nvidia_bmm_api_url }}"
        api_token: "{{ nvidia_bmm_api_token }}"
        org: "{{ nvidia_bmm_org }}"
        api_path_prefix: "{{ nvidia_bmm_api_path_prefix | default('forge') }}"
      register: carbide_prefix_result

    - name: Store created VPC prefix ID
      ansible.builtin.set_fact:
        carbide_vpc_prefix_id: "{{ carbide_prefix_result.resource.id }}"
        carbide_prefix_created: true

- name: Display effective VPC and prefix IDs
  ansible.builtin.debug:
    msg: "Using VPC: {{ carbide_vpc_id }}, Prefix: {{ carbide_vpc_prefix_id }}"

# Create VPC peering with management cluster so nodes can reach the control plane
- name: Create VPC peering with management cluster
  when:
    - nvidia_bmm_mgmt_vpc_id | default('') | length > 0
    - carbide_vpc_id != nvidia_bmm_mgmt_vpc_id
  nvidia.bare_metal.vpc_peering:
    state: present
    vpc1_id: "{{ carbide_vpc_id }}"
    vpc2_id: "{{ nvidia_bmm_mgmt_vpc_id }}"
    site_id: "{{ nvidia_bmm_site_id }}"
    wait: true
    wait_timeout: 300
    api_url: "{{ nvidia_bmm_api_url }}"
    api_token: "{{ nvidia_bmm_api_token }}"
    org: "{{ nvidia_bmm_org }}"
    api_path_prefix: "{{ nvidia_bmm_api_path_prefix | default('forge') }}"
  register: carbide_vpc_peering_result

- name: Display VPC peering result
  when: carbide_vpc_peering_result is defined and carbide_vpc_peering_result is not skipped
  ansible.builtin.debug:
    var: carbide_vpc_peering_result

- name: Store VPC peering ID
  when:
    - carbide_vpc_peering_result is defined
    - carbide_vpc_peering_result is not skipped
    - carbide_vpc_peering_result.resource is defined or carbide_vpc_peering_result.id is defined
  ansible.builtin.set_fact:
    carbide_vpc_peering_id: "{{ carbide_vpc_peering_result.resource.id | default(carbide_vpc_peering_result.id | default('')) }}"

# Instance provisioning (Phase 2)
- name: Provision Carbide instances into cluster VPC
  ansible.builtin.include_tasks: create_instances.yaml
  when: carbide_infra_node_requests is defined and carbide_infra_node_requests | length > 0

# Store infrastructure state in ConfigMap for deletion workflow
- name: Create ConfigMap with VPC and prefix state
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "carbide-infra-{{ carbide_infra_name }}"
        namespace: "{{ carbide_infra_configmap_namespace }}"
        labels:
          managed-by: osac
          provider: carbide
          cluster: "{{ carbide_infra_name }}"
      data:
        vpc_id: "{{ carbide_vpc_id }}"
        vpc_name: "{{ carbide_vpc_name }}"
        vpc_prefix_id: "{{ carbide_vpc_prefix_id }}"
        vpc_created: "{{ carbide_vpc_created | default(false) | string }}"
        prefix_created: "{{ carbide_prefix_created | default(false) | string }}"
        instance_ids: "{{ carbide_all_instance_ids | default([]) | to_json }}"
        vpc_peering_id: "{{ carbide_vpc_peering_id | default('') }}"
        site_id: "{{ nvidia_bmm_site_id }}"
        tenant_id: "{{ nvidia_bmm_tenant_id }}"

- name: Carbide infrastructure creation complete
  ansible.builtin.debug:
    msg: "Carbide infrastructure for {{ carbide_infra_name }} has been created successfully"
