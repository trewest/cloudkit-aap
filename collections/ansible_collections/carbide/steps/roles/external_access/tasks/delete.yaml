---
# =============================================================================
# Carbide: remove allocated IP from registry
# =============================================================================

- name: Read IP registry ConfigMap
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: carbide-ip-registry
    namespace: "{{ metallb_ip_registry_namespace | default('hardware-inventory') }}"
  register: ip_registry_info
  ignore_errors: true

- name: Remove cluster IP from registry
  when:
    - ip_registry_info.resources | length > 0
    - ip_registry_info.resources[0].data is defined
  kubernetes.core.k8s:
    state: present
    force: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: carbide-ip-registry
        namespace: "{{ metallb_ip_registry_namespace | default('hardware-inventory') }}"
      data: "{{ ip_registry_info.resources[0].data | dict2items | rejectattr('value', 'equalto', external_access_name) | items2dict }}"
  ignore_errors: true

# =============================================================================
# Shared: DNS record cleanup
# =============================================================================

- name: Delete dns records
  amazon.aws.route53:
    state: absent
    zone: "{{ external_access_base_domain }}"
    record: "{{ item }}"
    type: A
    wait: true
  environment:
    AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | trim }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | trim }}"
  loop:
  - "api.{{ external_access_name }}.{{ external_access_base_domain }}"
  - "api-int.{{ external_access_name }}.{{ external_access_base_domain }}"
  - "*.apps.{{ external_access_name }}.{{ external_access_base_domain }}"
