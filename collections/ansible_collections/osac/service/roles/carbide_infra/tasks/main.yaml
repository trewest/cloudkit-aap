---
# Main entry point for carbide_infra role
# Routes to create or delete tasks based on carbide_infra_state

- name: Validate required Carbide credentials are configured
  ansible.builtin.assert:
    that:
      - nvidia_bmm_api_url | length > 0
      - nvidia_bmm_client_id | length > 0
      - nvidia_bmm_client_secret | length > 0
      - nvidia_bmm_org | length > 0
      - nvidia_bmm_tenant_id | length > 0
      - nvidia_bmm_site_id | length > 0
      - nvidia_bmm_ssa_token_url | length > 0
    fail_msg: >
      Carbide credentials not configured. Ensure cluster-fulfillment-ig Secret
      contains NVIDIA_BMM_API_URL, NVIDIA_BMM_CLIENT_ID, NVIDIA_BMM_CLIENT_SECRET,
      NVIDIA_BMM_ORG, NVIDIA_BMM_TENANT_ID, NVIDIA_BMM_SITE_ID, NVIDIA_BMM_SSA_TOKEN_URL

- name: Exchange client credentials for JWT token
  ansible.builtin.uri:
    url: "{{ nvidia_bmm_ssa_token_url }}"
    method: POST
    url_username: "{{ nvidia_bmm_client_id }}"
    url_password: "{{ nvidia_bmm_client_secret }}"
    force_basic_auth: true
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      scope: "{{ nvidia_bmm_oauth_scope | default(omit) }}"
    status_code: 200
  register: carbide_token_response
  no_log: true  # CRITICAL: Prevent token exposure in logs (per T-01-02)

- name: Set Carbide API token for subsequent requests
  ansible.builtin.set_fact:
    nvidia_bmm_api_token: "{{ carbide_token_response.json.access_token }}"
  no_log: true  # CRITICAL: Prevent token exposure in logs

- name: Create Carbide infrastructure
  ansible.builtin.include_tasks: create_carbide_infra.yaml
  when: carbide_infra_state == 'present'

- name: Delete Carbide infrastructure
  ansible.builtin.include_tasks: delete_carbide_infra.yaml
  when: carbide_infra_state == 'absent'
