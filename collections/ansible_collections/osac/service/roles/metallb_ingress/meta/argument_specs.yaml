---
argument_specs:
  configure_metallb_ingress:
    options:
      metallb_ingress_admin_kubeconfig:
        type: str
        required: true
        description: Kubeconfig for hosted cluster (where MetalLB resources are created)
      metallb_ingress_ip:
        type: str
        required: true
        description: Pre-allocated IP address for MetalLB ingress
      infrastructure_provider:
        type: str
        required: false
        description: Infrastructure provider type ('nvidia_bmm' triggers BGP mode, omit for L2 mode)
      local_asn:
        type: int
        required: false
        description: Local ASN for MetalLB BGP speaker (required when infrastructure_provider is 'nvidia_bmm')
  allocate_ip:
    options:
      ingress_cidr_range:
        type: str
        required: true
        description: CIDR range for IP allocation (e.g., "192.168.100.0/24")
      cluster_name:
        type: str
        required: true
        description: Cluster name for IP registry tracking and idempotent allocation
      hub_kubeconfig:
        type: str
        required: false
        description: Kubeconfig for hub cluster (where IP registry ConfigMap lives)
