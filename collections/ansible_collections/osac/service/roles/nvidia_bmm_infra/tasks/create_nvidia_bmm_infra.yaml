---
# Create NVIDIA BMM infrastructure for cluster deployment
# This includes VPC, VPC prefix, and instances
# Supports using existing VPC/prefix if IDs are provided

- name: Display node requests
  ansible.builtin.debug:
    var: nvidia_bmm_infra_node_requests

- name: Set VPC and resource names
  ansible.builtin.set_fact:
    nvidia_bmm_vpc_name: "{{ nvidia_bmm_infra_vpc_name_prefix }}-{{ nvidia_bmm_infra_name }}"
    nvidia_bmm_prefix_name: "prefix-{{ nvidia_bmm_infra_name }}"
    nvidia_bmm_use_existing_vpc: "{{ nvidia_bmm_infra_vpc_id is defined and nvidia_bmm_infra_vpc_id | length > 0 }}"
    nvidia_bmm_use_existing_prefix: "{{ nvidia_bmm_infra_vpc_prefix_id is defined and nvidia_bmm_infra_vpc_prefix_id | length > 0 }}"

- name: Display VPC configuration
  ansible.builtin.debug:
    msg: >
      VPC mode: {{ 'using existing VPC ' + nvidia_bmm_infra_vpc_id if nvidia_bmm_use_existing_vpc else 'creating new VPC ' + nvidia_bmm_vpc_name }}

# Use existing VPC if ID provided
- name: Use existing VPC
  when: nvidia_bmm_use_existing_vpc
  ansible.builtin.set_fact:
    nvidia_bmm_vpc_id: "{{ nvidia_bmm_infra_vpc_id }}"

# Create new VPC if no ID provided
- name: Create VPC for cluster network
  when: not nvidia_bmm_use_existing_vpc
  block:
    - name: Create new VPC
      nvidia.bare_metal.vpc:
        state: present
        name: "{{ nvidia_bmm_vpc_name }}"
        site_id: "{{ nvidia_bmm_site_id }}"
        network_virtualization_type: "{{ nvidia_bmm_network_virtualization_type }}"
        api_url: "{{ nvidia_bmm_api_url }}"
        api_token: "{{ nvidia_bmm_api_token }}"
        org: "{{ nvidia_bmm_org }}"
        api_path_prefix: "{{ nvidia_bmm_api_path_prefix }}"
      register: nvidia_bmm_vpc_result

    - name: Store created VPC ID
      ansible.builtin.set_fact:
        nvidia_bmm_vpc_id: "{{ nvidia_bmm_vpc_result.resource.id }}"
        nvidia_bmm_vpc_created: true

# Use existing VPC prefix if ID provided
- name: Use existing VPC prefix
  when: nvidia_bmm_use_existing_prefix
  ansible.builtin.set_fact:
    nvidia_bmm_vpc_prefix_id: "{{ nvidia_bmm_infra_vpc_prefix_id }}"

# Create new VPC prefix if no ID provided
- name: Create VPC prefix for IP allocation
  when: not nvidia_bmm_use_existing_prefix
  block:
    - name: Determine IP block to use
      ansible.builtin.set_fact:
        nvidia_bmm_effective_ip_block_id: "{{ nvidia_bmm_infra_ip_block_id | default(nvidia_bmm_default_ip_block_id) }}"

    - name: Create new VPC prefix
      nvidia.bare_metal.vpc_prefix:
        state: present
        name: "{{ nvidia_bmm_prefix_name }}"
        vpc_id: "{{ nvidia_bmm_vpc_id }}"
        ip_block_id: "{{ nvidia_bmm_effective_ip_block_id }}"
        prefix_length: "{{ nvidia_bmm_infra_prefix_length | int }}"
        api_url: "{{ nvidia_bmm_api_url }}"
        api_token: "{{ nvidia_bmm_api_token }}"
        org: "{{ nvidia_bmm_org }}"
        api_path_prefix: "{{ nvidia_bmm_api_path_prefix }}"
      register: nvidia_bmm_prefix_result

    - name: Store created VPC prefix ID
      ansible.builtin.set_fact:
        nvidia_bmm_vpc_prefix_id: "{{ nvidia_bmm_prefix_result.resource.id }}"
        nvidia_bmm_prefix_created: true

- name: Display effective VPC and prefix IDs
  ansible.builtin.debug:
    msg: "Using VPC: {{ nvidia_bmm_vpc_id }}, Prefix: {{ nvidia_bmm_vpc_prefix_id }}"

# Fetch InfraEnv to get the iPXE boot script for the instances
- name: Wait for InfraEnv to be ready and get iPXE script
  block:
    - name: Display InfraEnv lookup parameters
      ansible.builtin.debug:
        msg: "Looking for InfraEnv '{{ nvidia_bmm_infra_infraenv_name }}' in namespace '{{ nvidia_bmm_infra_infraenv_namespace }}'"

    - name: Wait for InfraEnv resource to exist
      kubernetes.core.k8s_info:
        api_version: agent-install.openshift.io/v1beta1
        kind: InfraEnv
        namespace: "{{ nvidia_bmm_infra_infraenv_namespace }}"
        name: "{{ nvidia_bmm_infra_infraenv_name }}"
      register: infraenv_result
      until:
        - infraenv_result.resources | length > 0
        - infraenv_result.resources[0].status is defined
        - infraenv_result.resources[0].status.bootArtifacts is defined
        - infraenv_result.resources[0].status.bootArtifacts.ipxeScript is defined
      retries: "{{ nvidia_bmm_infra_infraenv_retries }}"
      delay: "{{ nvidia_bmm_infra_infraenv_delay }}"

    - name: Extract iPXE script URL from InfraEnv
      ansible.builtin.set_fact:
        nvidia_bmm_ipxe_script_url: "{{ infraenv_result.resources[0].status.bootArtifacts.ipxeScript }}"

    - name: Display iPXE script URL
      ansible.builtin.debug:
        msg: "InfraEnv iPXE script URL: {{ nvidia_bmm_ipxe_script_url }}"

    - name: Fetch iPXE script content from URL
      ansible.builtin.uri:
        url: "{{ nvidia_bmm_ipxe_script_url }}"
        method: GET
        return_content: true
        validate_certs: "{{ nvidia_bmm_infra_validate_certs | default(false) }}"
      register: ipxe_script_response

    - name: Store raw iPXE script content
      ansible.builtin.set_fact:
        nvidia_bmm_ipxe_script_raw: "{{ ipxe_script_response.content }}"

    - name: Prepend DNS server configuration to iPXE script
      ansible.builtin.set_fact:
        nvidia_bmm_ipxe_script: >-
          {{ nvidia_bmm_ipxe_script_raw | regex_replace('^(#!ipxe\n)', '\1set dns ' + nvidia_bmm_infra_ipxe_dns_server + '\n') }}
      when: nvidia_bmm_infra_ipxe_dns_server is defined and nvidia_bmm_infra_ipxe_dns_server | length > 0

    - name: Use iPXE script without DNS modification
      ansible.builtin.set_fact:
        nvidia_bmm_ipxe_script: "{{ nvidia_bmm_ipxe_script_raw }}"
      when: nvidia_bmm_infra_ipxe_dns_server is not defined or nvidia_bmm_infra_ipxe_dns_server | length == 0

    - name: Display iPXE script (first 200 chars)
      ansible.builtin.debug:
        msg: "iPXE script content (truncated): {{ nvidia_bmm_ipxe_script[:200] }}..."

- name: Calculate total instance count
  ansible.builtin.set_fact:
    nvidia_bmm_total_instances: "{{ nvidia_bmm_infra_node_requests | map(attribute='numberOfNodes') | map('int') | sum }}"

- name: Display instance provisioning plan
  ansible.builtin.debug:
    msg: "Will provision {{ nvidia_bmm_total_instances }} total instances across {{ nvidia_bmm_infra_node_requests | length }} resource class(es)"

# Process each resource class request
- name: Provision instances for each resource class
  ansible.builtin.include_tasks: create_instances_for_resource_class.yaml
  loop: "{{ nvidia_bmm_infra_node_requests }}"
  loop_control:
    loop_var: node_request
    label: "{{ node_request.resourceClass }}: {{ node_request.numberOfNodes }} nodes"

- name: Collect all provisioned instance IDs
  ansible.builtin.set_fact:
    nvidia_bmm_all_instance_ids: "{{ nvidia_bmm_all_instance_ids | default([]) }}"

- name: Display provisioned instances
  ansible.builtin.debug:
    msg: "Successfully provisioned {{ nvidia_bmm_all_instance_ids | length }} instances"

# Fetch instance details to get MAC addresses for agent matching
- name: Fetch instance details for MAC addresses
  nvidia.bare_metal.instance_info:
    id: "{{ instance_id }}"
    api_url: "{{ nvidia_bmm_api_url }}"
    api_token: "{{ nvidia_bmm_api_token }}"
    org: "{{ nvidia_bmm_org }}"
    api_path_prefix: "{{ nvidia_bmm_api_path_prefix }}"
  loop: "{{ nvidia_bmm_all_instance_ids }}"
  loop_control:
    loop_var: instance_id
    label: "{{ instance_id }}"
  register: nvidia_bmm_instance_details

- name: Initialize MAC to instance mapping
  ansible.builtin.set_fact:
    nvidia_bmm_mac_to_instance: {}

- name: Build MAC to instance mapping
  ansible.builtin.set_fact:
    nvidia_bmm_mac_to_instance: >-
      {{
        nvidia_bmm_mac_to_instance |
        combine({(item.resource.interfaces[0].mac_address | default('')) | lower: {
          'instance_id': item.resource.id,
          'instance_name': item.resource.name,
          'resource_class': item.resource.labels.resource_class | default('')
        }})
      }}
  loop: "{{ nvidia_bmm_instance_details.results }}"
  loop_control:
    label: "{{ item.resource.name | default(item.resource.id | default('unknown')) }}"
  when:
    - item.resource.interfaces is defined
    - item.resource.interfaces | length > 0
    - item.resource.interfaces[0].mac_address is defined

- name: Display MAC to instance mapping
  ansible.builtin.debug:
    var: nvidia_bmm_mac_to_instance

# Wait for agents to register - one per MAC address
- name: Display expected agents
  ansible.builtin.debug:
    msg: "Waiting for {{ nvidia_bmm_mac_to_instance | length }} agents to register with MAC addresses: {{ nvidia_bmm_mac_to_instance.keys() | list }}"

- name: Wait for agent with specific MAC address to register
  kubernetes.core.k8s_info:
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    namespace: "{{ nvidia_bmm_infra_infraenv_namespace }}"
  register: nvidia_bmm_agent_check
  until: >-
    nvidia_bmm_agent_check.resources |
    selectattr('status.inventory.interfaces', 'defined') |
    map(attribute='status.inventory.interfaces') |
    flatten |
    selectattr('macAddress', 'defined') |
    map(attribute='macAddress') |
    map('lower') |
    select('equalto', mac_entry.key) |
    list |
    length > 0
  retries: "{{ nvidia_bmm_infra_agent_registration_retries | default(90) }}"
  delay: "{{ nvidia_bmm_infra_agent_registration_delay | default(10) }}"
  loop: "{{ nvidia_bmm_mac_to_instance | dict2items }}"
  loop_control:
    loop_var: mac_entry
    label: "{{ mac_entry.value.instance_name }} ({{ mac_entry.key }})"

- name: Get final list of registered agents
  kubernetes.core.k8s_info:
    api_version: agent-install.openshift.io/v1beta1
    kind: Agent
    namespace: "{{ nvidia_bmm_infra_infraenv_namespace }}"
  register: nvidia_bmm_agents_result

- name: Display registered agents
  ansible.builtin.debug:
    msg: "{{ nvidia_bmm_agents_result.resources | length }} agents found in namespace"

# Match agents to instances by MAC address
- name: Match agents to provisioned instances
  ansible.builtin.set_fact:
    nvidia_bmm_matched_agents: []

- name: Build matched agents list
  ansible.builtin.set_fact:
    nvidia_bmm_matched_agents: >-
      {{
        nvidia_bmm_matched_agents + [{
          'agent_name': item.metadata.name,
          'agent_namespace': item.metadata.namespace,
          'mac_address': (item.status.inventory.interfaces | map(attribute='macAddress') | map('lower') | intersect(nvidia_bmm_mac_to_instance.keys() | list) | first),
          'instance_info': nvidia_bmm_mac_to_instance[(item.status.inventory.interfaces | map(attribute='macAddress') | map('lower') | intersect(nvidia_bmm_mac_to_instance.keys() | list) | first)]
        }]
      }}
  loop: "{{ nvidia_bmm_agents_result.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: >-
    item.status.inventory.interfaces is defined and
    (item.status.inventory.interfaces | map(attribute='macAddress') | map('lower') | intersect(nvidia_bmm_mac_to_instance.keys() | list) | length > 0)

- name: Display matched agents
  ansible.builtin.debug:
    var: nvidia_bmm_matched_agents

# Label and configure agents
# Labels must match what the NodePool agentLabelSelector expects
- name: Label and configure agents for cluster attachment
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: Agent
      metadata:
        name: "{{ matched_agent.agent_name }}"
        namespace: "{{ matched_agent.agent_namespace }}"
        labels: >-
          {{
            {
              cluster_order_label: nvidia_bmm_infra_name,
              esi_agent_resource_class_label: matched_agent.instance_info.resource_class,
              'nvidia-bmm-instance-id': matched_agent.instance_info.instance_id
            }
          }}
      spec:
        hostname: "{{ matched_agent.instance_info.instance_name | lower }}"
  loop: "{{ nvidia_bmm_matched_agents }}"
  loop_control:
    loop_var: matched_agent
    label: "{{ matched_agent.agent_name }} -> {{ matched_agent.instance_info.instance_name }}"

# Attach agents to cluster (if cluster deployment name is provided)
- name: Attach agents to cluster
  when: nvidia_bmm_infra_cluster_deployment_name is defined and nvidia_bmm_infra_cluster_deployment_name | length > 0
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: Agent
      metadata:
        name: "{{ matched_agent.agent_name }}"
        namespace: "{{ matched_agent.agent_namespace }}"
      spec:
        clusterDeploymentName:
          name: "{{ nvidia_bmm_infra_cluster_deployment_name }}"
          namespace: "{{ nvidia_bmm_infra_cluster_deployment_namespace | default(nvidia_bmm_infra_namespace) }}"
  loop: "{{ nvidia_bmm_matched_agents }}"
  loop_control:
    loop_var: matched_agent
    label: "{{ matched_agent.agent_name }}"

# Approve agents
- name: Approve agents
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: agent-install.openshift.io/v1beta1
      kind: Agent
      metadata:
        name: "{{ matched_agent.agent_name }}"
        namespace: "{{ matched_agent.agent_namespace }}"
      spec:
        approved: true
  loop: "{{ nvidia_bmm_matched_agents }}"
  loop_control:
    loop_var: matched_agent
    label: "{{ matched_agent.agent_name }}"

- name: Display agent configuration summary
  ansible.builtin.debug:
    msg: "Successfully configured and approved {{ nvidia_bmm_matched_agents | length }} agents for cluster {{ nvidia_bmm_infra_name }}"

# Store infrastructure info in Kubernetes ConfigMap for later reference
- name: Create ConfigMap with infrastructure details
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "nvidia-bmm-infra-{{ nvidia_bmm_infra_name }}"
        namespace: "{{ nvidia_bmm_infra_namespace }}"
        labels: "{{ nvidia_bmm_common_labels | combine({'cluster': nvidia_bmm_infra_name}) }}"
      data:
        vpc_id: "{{ nvidia_bmm_vpc_id }}"
        vpc_name: "{{ nvidia_bmm_vpc_name }}"
        vpc_prefix_id: "{{ nvidia_bmm_vpc_prefix_id }}"
        vpc_created: "{{ nvidia_bmm_vpc_created | default(false) | string }}"
        prefix_created: "{{ nvidia_bmm_prefix_created | default(false) | string }}"
        instance_ids: "{{ nvidia_bmm_all_instance_ids | to_json }}"
        site_id: "{{ nvidia_bmm_site_id }}"
        tenant_id: "{{ nvidia_bmm_tenant_id }}"


