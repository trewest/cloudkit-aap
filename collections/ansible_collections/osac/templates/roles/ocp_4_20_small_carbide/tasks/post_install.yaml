---
# Post-installation tasks for OpenShift 4.20 cluster on Carbide infrastructure
# Configures external access via MetalLB with IP allocation and BGP routing

- name: Get cluster-fulfillment-ig Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: cluster-fulfillment-ig
    namespace: "{{ cluster_fulfillment_namespace | default('default') }}"
    kubeconfig: "{{ hub_kubeconfig }}"
  register: cluster_fulfillment_secret_info
  no_log: true

- name: Extract INGRESS_CIDR from Secret
  ansible.builtin.set_fact:
    ingress_cidr_range: "{{ cluster_fulfillment_secret_info.resources[0].data.INGRESS_CIDR | b64decode }}"
  when: cluster_fulfillment_secret_info.resources | length > 0

- name: Validate INGRESS_CIDR is defined
  ansible.builtin.assert:
    that:
      - ingress_cidr_range is defined
      - ingress_cidr_range | length > 0
    fail_msg: "INGRESS_CIDR not found in cluster-fulfillment-ig Secret in namespace {{ cluster_fulfillment_namespace | default('default') }}"
    success_msg: "INGRESS_CIDR extracted: {{ ingress_cidr_range }}"

- name: Validate INGRESS_CIDR format
  ansible.builtin.assert:
    that:
      - ingress_cidr_range | ansible.utils.ipaddr
    fail_msg: "INGRESS_CIDR is not a valid CIDR format: {{ ingress_cidr_range }}"
    success_msg: "INGRESS_CIDR format validated"

- name: Retrieve kubeconfig for hosted cluster
  ansible.builtin.include_role:
    name: osac.service.retrieve_kubeconfig
  vars:
    retrieve_kubeconfig_cluster_name: "{{ cluster_order.metadata.name }}"
    retrieve_kubeconfig_kubeconfig: "{{ hub_kubeconfig }}"
    retrieve_kubeconfig_namespace: "{{ cluster_working_namespace }}"

- name: Write hosted cluster kubeconfig to temporary file
  ansible.builtin.copy:
    content: "{{ admin_kubeconfig | to_nice_yaml }}"
    dest: "/tmp/{{ cluster_order.metadata.name }}-kubeconfig.yaml"
    mode: '0600'
  register: kubeconfig_file

- name: Configure MetalLB ingress with IP allocation and BGP
  block:
    - name: Call metallb_ingress role
      ansible.builtin.include_role:
        name: osac.service.metallb_ingress
      vars:
        # IP allocation parameters (Plan 01)
        ingress_cidr_range: "{{ ingress_cidr_range }}"
        cluster_name: "{{ cluster_order.metadata.name }}"
        hub_kubeconfig: "{{ hub_kubeconfig }}"
        # MetalLB kubeconfig
        metallb_ingress_admin_kubeconfig: "{{ kubeconfig_file.dest }}"
        # BGP parameters (Plan 02)
        infrastructure_provider: "nvidia_bmm"
        local_asn: "{{ template_parameters.local_asn }}"
      register: metallb_result
      ignore_errors: yes

    - name: Clean up temporary kubeconfig file
      ansible.builtin.file:
        path: "{{ kubeconfig_file.dest }}"
        state: absent
      when: kubeconfig_file.dest is defined

  rescue:
    - name: Clean up temporary kubeconfig file on failure
      ansible.builtin.file:
        path: "{{ kubeconfig_file.dest }}"
        state: absent
      when: kubeconfig_file.dest is defined
      ignore_errors: yes

    - name: Read IP registry ConfigMap for cleanup
      kubernetes.core.k8s_info:
        api_version: v1
        kind: ConfigMap
        name: carbide-ip-registry
        namespace: "{{ metallb_ip_registry_namespace | default('hardware-inventory') }}"
        kubeconfig: "{{ hub_kubeconfig }}"
      register: cleanup_registry
      when: metallb_result is failed

    - name: Remove cluster IP from registry
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ hub_kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: carbide-ip-registry
            namespace: "{{ metallb_ip_registry_namespace | default('hardware-inventory') }}"
          data: "{{ cleanup_registry.resources[0].data | dict2items | rejectattr('value', 'equalto', cluster_order.metadata.name) | items2dict }}"
      when:
        - metallb_result is failed
        - cleanup_registry.resources | length > 0
      ignore_errors: yes

    - name: Fail with MetalLB configuration error
      ansible.builtin.fail:
        msg: "MetalLB ingress configuration failed after IP cleanup. See errors above."
      when: metallb_result is failed

- name: Fail if MetalLB configuration failed
  ansible.builtin.fail:
    msg: "MetalLB ingress configuration failed. See errors above."
  when: metallb_result is failed
