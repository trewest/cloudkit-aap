---
# Default OpenShift release image for 4.20
# Can be overridden via template_parameters.ocp_release_image
ocp_release_image: "quay.io/openshift-release-dev/ocp-release:4.20.0-multi"

# Instance type resolution: resource class names in nodeRequests must match
# Carbide instance type names directly. The carbide_infra role looks up the
# instance type by name via the Carbide API — no manual mapping needed.
#
# Example: if nodeRequests specifies resourceClass "dgx", there must be a
# Carbide instance type named "dgx" at the configured site.
