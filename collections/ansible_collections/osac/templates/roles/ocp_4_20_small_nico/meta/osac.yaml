# Template metadata for OSAC cluster-as-a-service
title: Simple OpenShift 4.20 Cluster (NICo)
description: >
  This template creates a minimally configured OpenShift 4.20 cluster
  using NVIDIA NICo Bare Metal Manager for infrastructure provisioning.
  Compute instances are provisioned on NICo-managed bare metal with
  per-cluster VPC isolation.

# Infrastructure provider for backend routing (per D-07)
# extract_template_info role extracts this to infrastructure_provider variable
# cluster_infra uses this to route to nico_infra (Plan 03)
infrastructure_provider: nvidia_bmm

# Default node request for cluster creation
# resourceClass values must match NICo instance type names at the configured site
default_node_request:
  - resourceClass: dgx
    numberOfNodes: 2

# Allowed resource classes for this template (per D-07)
# Cluster scale operations must use resource classes from this list
allowed_resource_classes:
  - dgx
  - gpu_small
  - gpu_large
