---
# Create instances for a specific resource class
# This task file is included from create_instances.yaml

# Resolve instance type by listing all types for the site and matching by name.
# Per the enhancement proposal, the hostclass name in nodeRequests matches the NICo
# instance type name — no user-maintained mapping dict needed.
- name: "{{ node_request.resourceClass }} - List instance types for site"
  nvidia.bare_metal.instance_type_info:
    site_id: "{{ nvidia_bmm_site_id }}"
    api_url: "{{ nvidia_bmm_api_url }}"
    api_token: "{{ nvidia_bmm_api_token }}"
    org: "{{ nvidia_bmm_org }}"
    api_path_prefix: "{{ nvidia_bmm_api_path_prefix | default('forge') }}"
  register: instance_type_list

- name: "{{ node_request.resourceClass }} - Find instance type by name"
  ansible.builtin.set_fact:
    instance_type_match: "{{ instance_type_list.resources | selectattr('name', 'equalto', node_request.resourceClass) | list }}"

- name: "{{ node_request.resourceClass }} - Validate instance type was found"
  ansible.builtin.assert:
    that:
      - instance_type_match | length > 0
    fail_msg: >
      NICo instance type '{{ node_request.resourceClass }}' not found at site '{{ nvidia_bmm_site_id }}'.
      Available instance types: {{ instance_type_list.resources | map(attribute='name') | list }}.
      The resource class name in nodeRequests must match a NICo instance type name.

- name: "{{ node_request.resourceClass }} - Set resolved instance type ID"
  ansible.builtin.set_fact:
    current_instance_type_id: "{{ instance_type_match[0].id }}"

- name: "{{ node_request.resourceClass }} - Display resolved instance type"
  ansible.builtin.debug:
    msg: "Using instance type ID: {{ current_instance_type_id }}"

# Determine SSH key group: use override if provided, otherwise use default
- name: "{{ node_request.resourceClass }} - Resolve SSH key group ID"
  ansible.builtin.set_fact:
    nico_effective_ssh_key_group_id: "{{ nico_infra_ssh_key_group_id if (nico_infra_ssh_key_group_id is defined and nico_infra_ssh_key_group_id | length > 0) else nvidia_bmm_default_ssh_key_group_id }}"

- name: "{{ node_request.resourceClass }} - Display SSH key group"
  ansible.builtin.debug:
    msg: "Using SSH key group ID: {{ nico_effective_ssh_key_group_id }}"

# Count existing instances for this cluster/resource class by checking
# agents that already have the cluster label and resource class label.
# Only create the delta to reach the desired count.
- name: "{{ node_request.resourceClass }} - Count existing agents for this resource class"
  kubernetes.core.k8s_info:
    kind: Agent
    api_version: agent-install.openshift.io/v1beta1
    namespace: "{{ nico_infra_infraenv_namespace }}"
    label_selectors:
      - "{{ cluster_order_label }}={{ nico_infra_name }}"
      - "{{ nico_agent_resource_class_label }}={{ node_request.resourceClass }}"
  register: existing_agents_for_class

- name: "{{ node_request.resourceClass }} - Compute instances to create"
  ansible.builtin.set_fact:
    instances_to_create: "{{ [(node_request.numberOfNodes | int) - (existing_agents_for_class.resources | length), 0] | max }}"

- name: "{{ node_request.resourceClass }} - Display provisioning plan"
  ansible.builtin.debug:
    msg: "{{ existing_agents_for_class.resources | length }} agents exist, {{ instances_to_create }} new instance(s) to create"

- name: "{{ node_request.resourceClass }} - Create instances"
  when: instances_to_create | int > 0
  nvidia.bare_metal.instance:
    state: present
    name: "{{ nico_infra_instance_name_prefix }}-{{ nico_infra_name }}-{{ node_request.resourceClass }}-{{ lookup('pipe', 'uuidgen') | lower | truncate(8, True, '') }}"
    tenant_id: "{{ nvidia_bmm_tenant_id }}"
    instance_type_id: "{{ current_instance_type_id }}"
    vpc_id: "{{ nico_vpc_id }}"
    operating_system_id: "{{ nvidia_bmm_default_operating_system_id }}"
    ipxe_script: "{{ nico_ipxe_script }}"
    interfaces:
      - vpc_prefix_id: "{{ nico_vpc_prefix_id }}"
        is_physical: true
    ssh_key_group_ids:
      - "{{ nico_effective_ssh_key_group_id }}"
    labels:
      managed-by: osac
      provider: nico
      cluster: "{{ nico_infra_name }}"
      resource_class: "{{ node_request.resourceClass }}"
    wait: "{{ nico_infra_wait }}"
    wait_timeout: "{{ nico_infra_wait_timeout }}"
    api_url: "{{ nvidia_bmm_api_url }}"
    api_token: "{{ nvidia_bmm_api_token }}"
    org: "{{ nvidia_bmm_org }}"
    api_path_prefix: "{{ nvidia_bmm_api_path_prefix | default('forge') }}"
  loop: "{{ range(instances_to_create | int) | list }}"
  loop_control:
    loop_var: instance_index
    label: "Instance {{ instance_index + 1 }} of {{ instances_to_create }}"
  register: instance_results

- name: "{{ node_request.resourceClass }} - Collect new instance IDs"
  when: instance_results.results is defined and instance_results.results | length > 0
  ansible.builtin.set_fact:
    nico_all_instance_ids: "{{ nico_all_instance_ids | default([]) + (instance_results.results | selectattr('resource', 'defined') | map(attribute='resource') | map(attribute='id') | list) }}"

- name: "{{ node_request.resourceClass }} - Collect existing instance IDs"
  ansible.builtin.set_fact:
    nico_all_instance_ids: "{{ nico_all_instance_ids | default([]) + (existing_agents_for_class.resources | selectattr('metadata.labels.nvidia-bmm-instance-id', 'defined') | map(attribute='metadata.labels.nvidia-bmm-instance-id') | list) }}"

- name: "{{ node_request.resourceClass }} - Display provisioned instance count"
  ansible.builtin.debug:
    msg: "Provisioned {{ node_request.numberOfNodes }} instance(s) for resource class {{ node_request.resourceClass }}"
