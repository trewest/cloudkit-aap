---
# Defaults for nico_infra role

# State: present or absent
nico_infra_state: present

# Cluster name (used for VPC naming per D-09)
nico_infra_name: ""

# Kubernetes namespace for ConfigMap state storage
nico_infra_namespace: ""

# Namespace for the infrastructure state ConfigMap
# Must be a persistent namespace that survives cluster deletion
nico_infra_configmap_namespace: "hardware-inventory"

# VPC naming prefix (per D-09: osac-vpc-{cluster_name})
nico_infra_vpc_name_prefix: "osac-vpc"

# VPC prefix length (subnet size)
nico_infra_prefix_length: "{{ nvidia_bmm_default_prefix_length | default(28) }}"

# Optional: Use existing VPC instead of creating new
nico_infra_vpc_id: ""

# Optional: Use existing VPC prefix instead of creating new
nico_infra_vpc_prefix_id: ""

# IP block ID for prefix allocation (required when creating new prefix)
nico_infra_ip_block_id: ""

# Instance provisioning (Phase 2)
# Node requests: list of {resourceClass: str, numberOfNodes: int}
nico_infra_node_requests: []

# InfraEnv resource for iPXE boot script
nico_infra_infraenv_namespace: "hardware-inventory"
nico_infra_infraenv_name: "hardware-inventory"
nico_infra_infraenv_retries: 60
nico_infra_infraenv_delay: 10

# Optional: DNS server to inject into iPXE script
# nico_infra_ipxe_dns_server: ""

# Instance naming prefix
nico_infra_instance_name_prefix: "osac-instance"

# Agent registration polling
nico_infra_agent_registration_retries: 90
nico_infra_agent_registration_delay: 10

# Batch provisioning
nico_infra_topology_optimized: false

# Wait configuration for instance operations
nico_infra_wait: true
nico_infra_wait_timeout: 1800

# Optional: Override SSH key group per template
# nico_infra_ssh_key_group_id: ""

# Certificate validation for iPXE script fetch
nico_infra_validate_certs: false
