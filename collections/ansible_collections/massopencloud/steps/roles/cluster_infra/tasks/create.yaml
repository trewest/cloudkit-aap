- name: Show node requests
  ansible.builtin.debug:
    var: cluster_infra_node_requests

# Backend routing: ESI or Carbide based on infrastructure_provider
# infrastructure_provider extracted from template meta/osac.yaml by extract_template_info role
# Defaults to 'esi' for backward compatibility

- name: Create ESI cluster network
  when: infrastructure_provider | default('esi') == 'esi'
  ansible.builtin.include_role:
    name: massopencloud.esi.network
  vars:
    network_suffix: "{{ cluster_infra_name }}"
    network_state: present
    network_properties:
      instance: "{{ cluster_order.metadata.namespace }}"
      clusterorder: "{{ cluster_infra_name }}"
      purpose: "o-sac"

- name: Set ESI network name
  when: infrastructure_provider | default('esi') == 'esi'
  ansible.builtin.set_fact:
    cluster_infra_network_name: "network-{{ cluster_infra_name }}"

- name: Create Carbide cluster infrastructure
  when: infrastructure_provider == 'nvidia_bmm'
  ansible.builtin.include_role:
    name: osac.service.carbide_infra
  vars:
    carbide_infra_state: present
    carbide_infra_name: "{{ cluster_infra_name }}"
    carbide_infra_namespace: "{{ cluster_working_namespace }}"
    carbide_infra_node_requests: "{{ cluster_infra_node_requests }}"
    # Optional template parameters for using existing VPC/prefix
    carbide_infra_vpc_id: "{{ template_parameters.vpc_id | default('') }}"
    carbide_infra_vpc_prefix_id: "{{ template_parameters.vpc_prefix_id | default('') }}"
    carbide_infra_ip_block_id: "{{ template_parameters.ip_block_id }}"
    carbide_infra_ssh_key_group_id: "{{ template_parameters.ssh_key_group_id | default('') }}"

# Handle scale down **before** scale up: if we add new agents first,
# they may not have spec.clusterDeployment.name set by the time
# we run detach_and_unlabel_all_removed_agents, causing them to be
# erroneously detached.

- name: Retrieve all currently allocated node pools
  kubernetes.core.k8s_info:
    api_version: hypershift.openshift.io/v1beta1
    kind: NodePool
    namespace: "{{ cluster_working_namespace }}"
  register: current_node_pools

# Only protect agents for resource classes being added for the FIRST time
# (no existing NodePool).  For existing resource classes, HyperShift decides
# which agent to detach during scale-down — it is NOT necessarily the
# last-created instance.  Protecting all matched agents would prevent cleanup
# of whichever agent HyperShift chose to remove.
- name: Collect existing resource classes from NodePools
  ansible.builtin.set_fact:
    existing_resource_classes: >-
      {{ current_node_pools.resources
         | json_query('[].metadata.labels."' + (agent_resource_class_label | default(esi_agent_resource_class_label)) + '"') }}

- name: Collect names of newly provisioned Carbide agents for new resource classes only
  when: infrastructure_provider == 'nvidia_bmm'
  ansible.builtin.set_fact:
    carbide_protected_agent_names: >-
      {{ carbide_matched_agents | default([])
         | json_query('[?!contains(`' + (existing_resource_classes | default([]) | to_json) + '`, instance_info.resource_class)].agent_name') }}

- name: Set resource classes included in the request
  ansible.builtin.set_fact:
    requested_resource_classes: >
      {{ cluster_infra_node_requests | map(attribute='resourceClass') }}

- name: Determine which resource classes are no longer needed
  ansible.builtin.set_fact:
    removed_resource_classes: "{{ removed_resource_classes | default([]) + [item.metadata.labels[agent_resource_class_label]] }}"
  with_items: "{{ current_node_pools.resources }}"
  when:
    - item.metadata.labels is defined
    - agent_resource_class_label in item.metadata.labels
    - item.metadata.labels[agent_resource_class_label] not in requested_resource_classes

- name: Display additional resource classes to be removed
  ansible.builtin.debug:
    msg: "The following resource classes are no longer requested: {{ removed_resource_classes | default([]) }}"

- name: Initialize updated cluster infra node requests that will include removed resource classes
  ansible.builtin.set_fact:
    updated_cluster_infra_node_requests: "{{ cluster_infra_node_requests }}"

- name: Add removed resource classes to updated cluster infra node requests
  ansible.builtin.set_fact:
    updated_cluster_infra_node_requests: "{{ updated_cluster_infra_node_requests + [{'numberOfNodes': '0', 'resourceClass': item}] }}"
  with_items: "{{ removed_resource_classes | default([]) }}"

- name: Wait for the Agents to be removed from the cluster
  ansible.builtin.include_role:
    name: manage_agents
    tasks_from: wait_for_agents_to_be_removed
  vars:
    manage_agents_cluster_order_name: "{{ cluster_infra_name }}"
    manage_agents_desired_count: "{{ item.numberOfNodes | int }}"
    manage_agents_resource_class: "{{ item.resourceClass }}"
  loop: "{{ updated_cluster_infra_node_requests }}"

# Carbide scale-down: capture instance IDs before detachment removes labels
- name: Capture Carbide instance IDs from removed agents (before detachment)
  when: infrastructure_provider == 'nvidia_bmm'
  block:
    - name: List agents currently labeled with the cluster order label
      kubernetes.core.k8s_info:
        kind: Agent
        api_version: agent-install.openshift.io/v1beta1
        namespace: "{{ default_agent_namespace }}"
        label_selectors:
          - "{{ cluster_order_label }}={{ cluster_infra_name }}"
      register: carbide_allocated_agents

    - name: Filter agents removed from the cluster (excluding newly provisioned)
      ansible.builtin.set_fact:
        carbide_removed_agents: >-
          {{ carbide_allocated_agents.resources
             | json_query('[?metadata.labels."agent-install.openshift.io/clusterdeployment-namespace"==``]')
             | json_query('[?!contains(`' + (carbide_protected_agent_names | default([]) | to_json) + '`, metadata.name)]') }}

    - name: Extract instance IDs from removed agents
      ansible.builtin.set_fact:
        carbide_removed_instance_ids: >-
          {{
            carbide_removed_agents |
            selectattr('metadata.labels.nvidia-bmm-instance-id', 'defined') |
            map(attribute='metadata.labels.nvidia-bmm-instance-id') |
            list
          }}

    - name: Extract hostnames for BGPPeer cleanup
      ansible.builtin.set_fact:
        carbide_removed_agent_hostnames: >-
          {{
            carbide_removed_agents |
            selectattr('spec.hostname', 'defined') |
            map(attribute='spec.hostname') |
            list
          }}

    - name: Display scale-down cleanup plan
      ansible.builtin.debug:
        msg: "Scale-down cleanup: {{ carbide_removed_instance_ids | length }} instances, {{ carbide_removed_agent_hostnames | length }} BGPPeers to clean up"

- name: Detach agents from cluster
  ansible.builtin.include_role:
    name: manage_agents
    tasks_from: detach_and_unlabel_all_removed_agents
  vars:
    manage_agents_cluster_order_name: "{{ cluster_infra_name }}"
    manage_agents_protected_agents: "{{ carbide_protected_agent_names | default([]) }}"

# Carbide scale-down: destroy removed instances and clean up BGPPeers
- name: Clean up Carbide instances for removed agents
  when:
    - infrastructure_provider == 'nvidia_bmm'
    - carbide_removed_instance_ids is defined
    - carbide_removed_instance_ids | length > 0
  ansible.builtin.include_role:
    name: osac.service.carbide_infra
    tasks_from: scale_down_cleanup
  vars:
    carbide_infra_name: "{{ cluster_infra_name }}"

- name: Clean up BGPPeers for removed agents
  when:
    - infrastructure_provider == 'nvidia_bmm'
    - carbide_removed_agent_hostnames is defined
    - carbide_removed_agent_hostnames | length > 0
  ansible.builtin.include_role:
    name: osac.service.metallb_ingress
    tasks_from: delete_bgp_peers

- name: Select and label new Agent resources
  ansible.builtin.include_role:
    name: manage_agents
    tasks_from: select_and_label_new_agents
  vars:
    manage_agents_cluster_order_name: "{{ cluster_infra_name }}"
    manage_agents_desired_count: "{{ item.numberOfNodes | int }}"
    manage_agents_resource_class: "{{ item.resourceClass }}"
  loop: "{{ cluster_infra_node_requests }}"

- name: Attach agents to cluster network and approve them
  ansible.builtin.include_role:
    name: manage_agents
    tasks_from: attach_and_approve_all_new_agents
  vars:
    manage_agents_cluster_order_name: "{{ cluster_infra_name }}"
    manage_agents_cluster_network: "{{ cluster_infra_network_name | default(omit) }}"
