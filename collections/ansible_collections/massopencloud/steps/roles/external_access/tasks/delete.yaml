# =============================================================================
# Provider-specific: cleanup allocated resources
# =============================================================================

- name: ESI cleanup
  when: infrastructure_provider is not defined or infrastructure_provider != 'nvidia_bmm'
  ansible.builtin.include_tasks: destroy_external_access_esi.yaml

- name: Carbide cleanup
  when:
    - infrastructure_provider is defined
    - infrastructure_provider == 'nvidia_bmm'
  ansible.builtin.include_tasks: destroy_external_access_carbide.yaml

# =============================================================================
# Shared: DNS record cleanup
# =============================================================================

- name: Delete dns records
  amazon.aws.route53:
    state: absent
    zone: "{{ external_access_base_domain }}"
    record: "{{ item }}"
    type: A
    wait: true
  environment:
    AWS_ACCESS_KEY_ID: "{{ lookup('env', 'AWS_ACCESS_KEY_ID') | trim }}"
    AWS_SECRET_ACCESS_KEY: "{{ lookup('env', 'AWS_SECRET_ACCESS_KEY') | trim }}"
  loop:
  - "api.{{ external_access_name }}.{{ external_access_base_domain }}"
  - "api-int.{{ external_access_name }}.{{ external_access_base_domain }}"
  - "*.apps.{{ external_access_name }}.{{ external_access_base_domain }}"
