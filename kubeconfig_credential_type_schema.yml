---
# Schema for Kubernetes Kubeconfig Credential Type in Ansible Automation Platform
# This schema defines the input fields for a custom credential type that stores
# Kubernetes cluster authentication information from a kubeconfig file.

controller_credential_types:
  - name: Kubernetes Kubeconfig
    description: Credential type for Kubernetes cluster authentication using kubeconfig data
    kind: cloud
    inputs:
      fields:
        # Server URL - the API server endpoint
        - type: string
          id: kubeconfig_server
          label: Kubernetes API Server URL
          help_text: The URL of the Kubernetes API server (e.g., https://api.example.com:6443)
        
        # Certificate Authority Data - base64 encoded CA certificate
        - type: string
          id: kubeconfig_ca_data
          label: Certificate Authority Data
          secret: true
          help_text: Base64-encoded certificate authority data from kubeconfig
        
        # Client Certificate Data - base64 encoded client certificate
        - type: string
          id: kubeconfig_client_cert_data
          label: Client Certificate Data
          secret: true
          help_text: Base64-encoded client certificate data from kubeconfig
        
        # Client Key Data - base64 encoded client private key
        - type: string
          id: kubeconfig_client_key_data
          label: Client Key Data
          secret: true
          help_text: Base64-encoded client key data from kubeconfig
        
        # Namespace - optional default namespace
        - type: string
          id: kubeconfig_namespace
          label: Default Namespace
          help_text: Default namespace to use (optional)
          default: default
        
        # Context Name - optional context name
        - type: string
          id: kubeconfig_context
          label: Context Name
          help_text: Name of the kubeconfig context to use (optional)
      
      required:
        - kubeconfig_server
        - kubeconfig_ca_data
        - kubeconfig_client_cert_data
        - kubeconfig_client_key_data
    
    injectors:
      # Inject as environment variables for kubectl/oc commands
      env:
        KUBECONFIG_SERVER: "{{ kubeconfig_server }}"
        KUBECONFIG_CA_DATA: "{{ kubeconfig_ca_data }}"
        KUBECONFIG_CLIENT_CERT_DATA: "{{ kubeconfig_client_cert_data }}"
        KUBECONFIG_CLIENT_KEY_DATA: "{{ kubeconfig_client_key_data }}"
        KUBECONFIG_NAMESPACE: "{{ kubeconfig_namespace | default('default') }}"
        KUBECONFIG_CONTEXT: "{{ kubeconfig_context | default('') }}"
      
      # Inject as extra_vars for use in playbooks
      extra_vars:
        kubeconfig_server: "{{ kubeconfig_server }}"
        kubeconfig_ca_data: "{{ kubeconfig_ca_data }}"
        kubeconfig_client_cert_data: "{{ kubeconfig_client_cert_data }}"
        kubeconfig_client_key_data: "{{ kubeconfig_client_key_data }}"
        kubeconfig_namespace: "{{ kubeconfig_namespace | default('default') }}"
        kubeconfig_context: "{{ kubeconfig_context | default('') }}"
      
      # Alternative: Create a temporary kubeconfig file
      # This injector creates a kubeconfig file that can be used with kubectl/oc
      # Note: The file injector creates a file that can be referenced via KUBECONFIG env var
      file:
        template: |
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              certificate-authority-data: "{{ kubeconfig_ca_data }}"
              server: "{{ kubeconfig_server }}"
            name: cluster
          contexts:
          - context:
              cluster: cluster
              namespace: "{{ kubeconfig_namespace | default('default') }}"
              user: admin
            name: "{{ kubeconfig_context | default('admin') }}"
          current-context: "{{ kubeconfig_context | default('admin') }}"
          users:
          - name: admin
            user:
              client-certificate-data: "{{ kubeconfig_client_cert_data }}"
              client-key-data: "{{ kubeconfig_client_key_data }}"
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config-{{ inventory_hostname }}"

