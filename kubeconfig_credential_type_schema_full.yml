---
# Alternative Schema for Kubernetes Kubeconfig Credential Type
# This version accepts the entire kubeconfig as a single field, which may be
# more convenient for users who want to paste the complete kubeconfig content.

controller_credential_types:
  - name: Kubernetes Kubeconfig (Full)
    description: Credential type for Kubernetes cluster authentication using complete kubeconfig content
    kind: cloud
    inputs:
      fields:
        # Full kubeconfig content - accepts the entire kubeconfig YAML/JSON
        - type: string
          id: kubeconfig_content
          label: Kubeconfig Content
          secret: true
          multiline: true
          help_text: Complete kubeconfig content (YAML or JSON format)
        
        # Optional: Context name to use if multiple contexts exist
        - type: string
          id: kubeconfig_context
          label: Context Name (Optional)
          help_text: Name of the kubeconfig context to use. If not specified, uses current-context from kubeconfig.
      
      required:
        - kubeconfig_content
    
    injectors:
      # Create a temporary kubeconfig file from the content
      file:
        template: "{{ kubeconfig_content }}"
        dest: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config-{{ inventory_hostname }}"
      
      # Set KUBECONFIG environment variable
      env:
        KUBECONFIG: "{{ lookup('ansible.builtin.env', 'HOME') }}/.kube/config-{{ inventory_hostname }}"
        KUBECONFIG_CONTEXT: "{{ kubeconfig_context | default('') }}"
      
      # Inject as extra_vars for use in playbooks
      extra_vars:
        kubeconfig_content: "{{ kubeconfig_content }}"
        kubeconfig_context: "{{ kubeconfig_context | default('') }}"

